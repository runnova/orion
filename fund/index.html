<!DOCTYPE html>
<html lang="en" xml:lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Contacts</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../../nova.css">
    </script>
</head>

<body>
    <button onclick="senddarkcredit(this)">
        Send 1 credit
    </button>
    <script>
        function senddarkcredit(obj) {
            obj.disabled = true
            obj.innerText = "Sending..."

            roturExtension.transferCurrency({
                AMOUNT: 1,
                USER: "darkdot",
                NOTE: "Thanks for Orion!"
            }).then((result) => {
                if (result === "Success") {
                    obj.innerText = "Sent!"
                    setTimeout(() => {
                        obj.innerText = "Send again"
                        obj.disabled = false
                    }, 3000)
                } else {
                    obj.innerText = "Failed"
                    setTimeout(() => {
                        obj.innerText = "Try again"
                        obj.disabled = false
                    }, 3000)
                }
            }).catch(() => {
                obj.innerText = "Error"
                setTimeout(() => {
                    obj.innerText = "Try again"
                    obj.disabled = false
                }, 3000)
            })
        }
    </script>
    <script src="script.js"></script>
</body>

</html>
