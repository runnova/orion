<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Me</title>
    <link rel="stylesheet" href="../../nova.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="main">
        <div class="header">
            <div class="menu">
                <div class="btn">Cosmetics</div>
            </div>
            <div class="searchbar">
                <input type="text" id="searchInput" placeholder="Search items...">
                <div class="icon">search</div>
            </div>
        </div>
        <div id="listing">

        </div>
    </div>
    <dialog id="item_preview">
        <div class="content">
            <div class="preview_part">
                <div class="pfp">
                    <img src="" id="prof_pfp_preview" alt="">
                    <img src="" class="overlay" alt="">
                </div>
            </div>
            <div class="detail_part">
                <div class="item_type">Overlay</div>
                <div class="name">Item name</div>
                <div class="item_desc">Description</div>
                <div class="other_data"></div>
            </div>
        </div>
    </dialog>
    <script src="script.js"></script>
</body>

</html>
