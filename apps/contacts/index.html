<!DOCTYPE html>
<html lang="en" xml:lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Contacts</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../../nova.css">
    </script>
</head>

<body>
    <div class="mainUI">
        <div class="topNav">
            <div class="searchContainer">
                <input placeholder="Search a username..." id="usersearchbar">
                <div class="button" onclick="makeSearch()">
                    <span class="material-symbols-rounded">
                        search
                    </span>
                </div>
            </div>
        </div>
        <div class="contactsListMaster">

            <div class="filterBtns">
                <div class="btn">All</div>
                <div class="btn">Friends</div>
            </div>
            <div id="contactsList">
                <div class="sing_contact">
                    <div class="contactsDefVisSec">
                        <div class="pfp">
                            <img src="../../oclogo.png" alt="">
                        </div>
                        <div class="data">
                            <div class="name">darkdot</div>
                            <div class="noteDisplay">This is a note</div>
                        </div>
                        <div class="gobtn material-symbols-rounded">chevron_right</div>
                    </div>
                    <div class="contactsMoreSec">
                        <div class="big btn">
                            <div class="icn material-symbols-rounded">person</div>
                            <span>View profile</span>
                        </div>
                        <div class="big btn">
                            <div class="icn material-symbols-rounded">person_add</div>
                            <span>Add friend</span>
                        </div>
                        <div class="big btn">
                            <div class="icn material-symbols-rounded">send_money</div>
                            <span>Send credits</span>
                        </div>
                        <div class="big btn">
                            <div class="icn material-symbols-rounded">Edit_note</div>
                            <span>Edit note</span>
                        </div>
                        <div class="big btn">
                            <div class="icn material-symbols-rounded">delete_forever</div>
                            <span>Delete contact</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
