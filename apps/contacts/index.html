<!DOCTYPE html>
<html lang="en" xml:lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Contacts</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../../nova.css">
    </script>
</head>

<body>
    <div class="mainUI">
        <div class="topNav">
            <div class="searchContainer">
                <input placeholder="Search a username..." id="usersearchbar">
                <div class="button" onclick="makeSearch()">
                    <span class="icon">
                        search
                    </span>
                </div>
            </div>
        </div>
        <div class="contactsListMaster">
            <div class="filterBtns">
                <div class="btn" onclick="importFriendsFromRotur()">
                    <i class="icon">person_check</i>
                    Import friends
                </div>
                <div class="btn cant" onclick="">
                    <i class="icon">download</i>
                    Import Contacts
                </div>
                <div class="btn cant" onclick="">
                    <i class="icon">save_as</i>
                    Export Contacts
                </div>
            </div>
            <div class="contact-header" id="pinnedHeader">
                <i class="icon" id="pinnedHeadIcn">keep</i>
            </div>
            <div id="pinned">
                <div class="nothingtext">No pinned contacts</div>
            </div>
            <div id="contactsList">

            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
